<app-header>
  <div class="sub-header-container">
    <div class="sub-header-item sub-header-left-item flex-grow right-arc"></div>
    <div id="layers-control" class="sub-headers">
      <div class="sub-header-item left-arc right-arc">
        <div class="sub-header-item-text">
          {{ 'mainTitle' | translate }}
        </div>
      </div>
    </div>
    <div class="sub-header-item sub-header-right-item left-arc"></div>
  </div>
</app-header>
<div class="container-fluid margin-top">
  <div class="dashboard">
    <a [href]="mapHref('shoc')">
      <img src="assets/images/posters/shoc.webp" alt="Shadow of Chernobyl">
    </a>
    <a [href]="mapHref('cs')">
      <img src="assets/images/posters/cs2.webp" alt="Clear Sky">
    </a>
    <a [href]="mapHref('cop')">
      <img src="assets/images/posters/cop.webp" alt="Call of Pripyat">
    </a>
    <a [href]="mapHref('hoc')">
      <img src="assets/images/posters/s2.webp" alt="Heart of Chornobyl">
    </a>
  </div>
  <nav class="content-index" aria-hidden="true">
    <div class="content-index-title">{{ 'mapContentIndex' | translate }}</div>
    <a [href]="contentHref('shoc')" tabindex="-1">{{ 'shocMapContentPageTitle' | translate }}</a>
    <a [href]="contentHref('cs')" tabindex="-1">{{ 'csMapContentPageTitle' | translate }}</a>
    <a [href]="contentHref('cop')" tabindex="-1">{{ 'copMapContentPageTitle' | translate }}</a>
  </nav>
</div>
