name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npm run build -- --base-href /stalker-map/

      - name: Rewrite root-relative asset URLs for Project Pages
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('dist/stalker-map')
          text_exts = {'.html', '.js', '.css', '.json', '.xml', '.txt', '.svg'}
          changed = 0

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('/assets/', '/stalker-map/assets/')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          print(f'Rewritten asset paths in {changed} files')
          PY

      - name: Add SPA fallback
        run: cp dist/stalker-map/index.html dist/stalker-map/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/stalker-map

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
