name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch root-relative asset URLs before build
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('src')
          text_exts = {'.ts', '.html', '.scss', '.css', '.json', '.xml', '.txt', '.svg'}
          replacements = (
              ("'/assets/", "'/stalker-map/assets/"),
              ('"/assets/', '"/stalker-map/assets/'),
              ('`/assets/', '`/stalker-map/assets/'),
              ('url(/assets/', 'url(/stalker-map/assets/'),
          )

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Patched {len(changed)} source files')
          for path in changed:
              print(path)
          PY

      - name: Build for GitHub Pages
        run: npm run build -- --base-href /stalker-map/

      - name: Add HoC locale aliases
        run: |
          cp dist/stalker-map/assets/data/hoc/chi_cpr.json dist/stalker-map/assets/data/hoc/chn.json
          cp dist/stalker-map/assets/data/hoc/es.json dist/stalker-map/assets/data/hoc/esp.json

      - name: Patch residual generated asset URLs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('dist/stalker-map')
          targets = []
          targets.extend(root.glob('main.*.js'))
          targets.extend(root.glob('styles.*.css'))
          targets.extend([root / 'index.html'])

          replacements = (
              ("'/assets/", "'/stalker-map/assets/"),
              ('"/assets/', '"/stalker-map/assets/'),
              ('`/assets/', '`/stalker-map/assets/'),
              ('url(/assets/', 'url(/stalker-map/assets/'),
          )

          for path in targets:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  print(f'Patched generated file: {path}')
          PY

      - name: Verify Project Pages build
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          root = Path('dist/stalker-map')
          check_files = []
          check_files.extend(root.glob('main.*.js'))
          check_files.extend(root.glob('styles.*.css'))
          check_files.extend([root / 'index.html'])

          bad_patterns = ("'/assets/", '"/assets/', '`/assets/', 'url(/assets/')
          failures = []

          for path in check_files:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              found = [pattern for pattern in bad_patterns if pattern in text]
              if found:
                  failures.append((str(path), found))

          required = [
              root / 'assets/data/hoc/map.json',
              root / 'assets/data/hoc/items.json',
              root / 'assets/data/hoc/chn.json',
          ]
          missing = [str(path) for path in required if not path.is_file()]

          if failures:
              print('Found root-relative /assets/ references after final patch:')
              for path, patterns in failures:
                  print(path, patterns)
          if missing:
              print('Missing required HoC files:')
              for path in missing:
                  print(path)

          if failures or missing:
              sys.exit(1)

          bundles = sorted(root.glob('main.*.js'))
          print('Main bundle:', bundles[0].name if bundles else 'NOT FOUND')
          print('Project Pages build verification passed')
          PY

      - name: Add SPA fallback
        run: cp dist/stalker-map/index.html dist/stalker-map/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/stalker-map

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
